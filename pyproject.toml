[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aegis-workbench"
version = "0.1.0"
description = "Local security assurance workbench foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.16,<1", "pydantic>=2.11,<3", "PyYAML>=6.0.2,<7", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["psycopg[binary]>=3.2,<4", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "build>=1,<2", "httpx>=0.28,<1"]

[project.scripts]
aegis = "aegis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["durable: use a durable producer API with no embedded worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
