name: AEGIS verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    working-directory: ${{ vars.AEGIS_WORKING_DIRECTORY || '.' }}
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -c requirements-dev.lock -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/operational_drill.py
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: python -m build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -t aegis-local .
      - run: python scripts/container_smoke.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: aegis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,postgres]"
      - run: python -m pytest tests/test_api.py tests/test_transfer.py tests/test_workflow.py tests/test_planning.py tests/test_lifecycle.py tests/test_durable_jobs.py tests/test_deletion.py tests/test_pg_recovery.py tests/test_artifact_lifecycle.py tests/test_recovery_retention.py
        env:
          AEGIS_TEST_POSTGRES_URL: postgresql://aegis_test:disposable_ci_password@127.0.0.1:5432/aegis_test
